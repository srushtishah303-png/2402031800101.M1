<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: crimson;
        }

    </style></head>
<body>
    <script>


        document.write("<h1>Data Types--</h1>");
        document.write("<h1>Primitive data</h1>");

        //1. number
        document.write("<h2>number</h2>");
        a=5
        
        
        
        document.write(typeof a);
        document.write("<br>" +a);


        //2. Boolean

        document.write("<h2>Boolean</h2>");
         var b = true;
        
        document.write("<br>" +b);
        document.write(typeof b);
        document.write("<br>" +b);

      
//composite data type (or complex data types)

document.write("<h1>composite data type</h1>");
        // 1. Object
let student = {
    name: "Rahul",
    age: 18,
    city: "Ahmedabad"
};

document.write("<h3>Object</h3>");
document.write("Name: " + student.name + "<br>");
document.write("Age: " + student.age + "<br>");
document.write("City: " + student.city + "<br><br>");


// 2. Array
let numbers = [10, 20, 30, 40, 50];

document.write("<h3>Array</h3>");
document.write(numbers + "<br>");
document.write("First Element: " + numbers[0] + "<br><br>");


// 3. String
let message = "Hello, World!";
document.write("<h3>String</h3>");
document.write(message + "<br><br>");


//special data types
document.write("<h1>Special Data Types</h1>");

// 4. Null
let emptyValue = null;

document.write("<h3>Null</h3>");
document.write(emptyValue + "<br><br>");


// 5. Undefined
let x;

document.write("<h3>Undefined</h3>");
document.write(x);

document.write("<h1>Operators--</h1>");

// Arithmetic Operators
let a1 = 10;
let b1 = 3;

document.write("<h1>Arithmetic Operators</h1>");
document.write("Addition: " + (a1 + b1) + "<br>");
document.write("Subtraction: " + (a1 - b1) + "<br>");
document.write("Multiplication: " + (a1 * b1) + "<br>");
document.write("Division: " + (a1 / b1) + "<br>");
document.write("Modulus: " + (a1 % b1) + "<br><br>");


// Post Increment / Decrement
let x1 = 5;
document.write("<h1>Post Increment/Decrement</h1>");
document.write("Post Increment: " + (x1++) + "<br>");
document.write("After Post Increment: " + x1 + "<br>");

document.write("Post Decrement: " + (x1--) + "<br>");
document.write("After Post Decrement: " + x1 + "<br><br>");


// Pre Increment / Decrement
let y1 = 5;

document.write("<h1>Pre Increment/Decrement</h1>");
document.write("Pre Increment: " + (++y1) + "<br>");
document.write("Pre Decrement: " + (--y1) + "<br><br>");


// Comparison Operators
let p = 10;
let q = "10";
document.write("<h1>Comparison Operators</h1>");
document.write("== : " + (p == q) + "<br>");
document.write("!= : " + (p != q) + "<br>");
document.write("> : " + (p > 5) + "<br>");
document.write(">= : " + (p >= 10) + "<br>");
document.write("< : " + (p < 20) + "<br>");
document.write("<= : " + (p <= 10) + "<br><br>");


// Strict Comparison Operators
document.write("<h1>Strict Comparison Operators</h1>");
document.write("=== : " + (p === q) + "<br>");
document.write("!== : " + (p !== q) + "<br>");


    </script>
</body>
</html>
