<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Variables</h2>

<p>In this example, x, y, and z are variables.</p>

<p id="demo"></p>
<p id="demo1"></p>
<p id="demo2"></p>
<p id="demo3"></p>

<script>
var x = 5;
var y = 6;
var z = x+y;
var w = x - y;
var e = x * y;
var p = x / y;
document.getElementById("demo").innerHTML ="value of z is: " + z;
document.getElementById("demo1").innerHTML ="value of w is: " + w;
document.getElementById("demo2").innerHTML ="value of e is: " + e;
document.getElementById("demo3").innerHTML ="value of p is: " + p;
</script>
</body>
</html>
