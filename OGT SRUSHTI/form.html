<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
    table{
            background-color: greenyellow;
        }
    </style>
</head>
<body>
    <form>
    <table border="1" cellspacing="2">
        <captain>Form</captain>
         <tr align="center">
              <td colspan="2">
                <label>First Name:</label></td>
                <td>
                <input type="text" name="first name" placeholder="enter the first name" required>

              </td>
               <tr align="center">
              <td colspan="2">
                <label>Last Name:</label></td>
                <td>
                <input type="text" name="last name" placeholder="enter the last name" required>

              </td>
              <tr align="center">
              <td colspan="2">
                <label>Contact no:</label></td>
                <td>
                <input type="number" name="contact no" placeholder="enter the contact" required>
              </td>
                <tr align="center">
              <td colspan="2">
                <label>Landline no:(079-123456)</label></td>
                <td>
                <input type="number" name="landlineno" placeholder="xxx-xxxxxxx" required>
              </td>
               <tr align="center">
              <td colspan="2">
                <label>Email:</label></td>
                <td>
                <input type="email" name="email" placeholder="enter email" required>
              </td>
                 <tr align="center">
              <td colspan="2">
                <label>Password:</label></td>
                <td>
                <input type="password" name="password" placeholder="enter password" required>
              </td>
                <tr align="center">
              <td colspan="2">
                <label>Date of Birth:</label></td>
                <td>
                <input type="date" name="date" placeholder="" required>
            </td>
              <tr align="center">
              <td colspan="2">
                <label>Age:</label></td>
                <td>
                <input type="number" name="age" placeholder="enter age" required>
              </td>
              <tr align="center">
              <td colspan="2">
                <label>Gender:</label></td>
                <td>
                <input type="radio" name="gender"  required>male
                <input type="radio" name="grnder" required>female
              </td>
              <tr align="center">
              <td colspan="2">
                <label>Address:</label></td>
                <td>
                <input type="text" name="Address" placeholder="enter Address" required>
              </td>
       <tr align="center">
              <td colspan="2">
                <label>City:</label></td>
                <td>
                <select>
                <option value="city 1">select city  </option>
       </select>
                </td>

       <tr align="center">  
              <td colspan="2">
                <label>Pin code:</label></td>
                <td>
                <input type="number" name="pin code" placeholder="enter pin code" required>
              </td>
              <tr align="center">
              <td colspan="2">
                <label>Join date:</label></td>
                <td>
                <input type="date" name="join date" placeholder="enter join date" required>
              </td>
               <tr align="center">
              <td colspan="2">
                <label>Confirm your form:</label></td>
                <td>
                <input type="submit" name="submit" required>
                  <input type="reset" name="reset" required>
              </td>
            </form>
    </table>
</body>
</html>
