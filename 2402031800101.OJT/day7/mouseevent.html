<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mousesover and Mouseout events</title>
</head>
<body>
    <img src="image.png" alt="" id="bulb"> 
</body>
<h1>Mouseover and Mouseout events</h1>

<script>
 var a = document.getElementById("bulb");
a.addEventListener("mouseover",()=>{
 a.src= "image copy.png";
});
a.addEventListener("mouseout",()=>{
    a.src= "image.png";
});
</script>

</html>
