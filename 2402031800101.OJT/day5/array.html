<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // Creating an array using array literal syntax
        let arr = [1, 2, 3, 4, 5];
        document.write(arr[0] + "<br>"); // Output: 1
        document.write(arr[1] + "<br>"); // Output: 2
        document.write(arr[2] + "<br>"); // Output: 3
        document.write(arr[3] + "<br>"); // Output: 4
        document.write(arr[4] + "<br>"); // Output: 5

        // Creating an array using the Array constructoro

        let arr2 = new Array(10, 20, 30, 40, 50);
        document.write(arr2[0] + "<br>"); // Output: 10
        document.write(arr2[1] + "<br>"); // Output: 20
        document.write(arr2[2] + "<br>"); // Output: 30
        document.write(arr2[3] + "<br>"); // Output: 40
        document.write(arr2[4] + "<br>"); // Output: 50

        //for loop to access array elements

        var colors = ["red", "green", "blue"];
        document.write(colors[0] + "<br>"); 
         document.write(colors[1] + "<br>"); 
          document.write(colors[2] + "<br>"); 

          // Accessing array elements using a loop

          var color = new Array("yellow", "purple", "orange");
          document.write(color[0] + "<br>");
          

    </script>
</body>
</html>
