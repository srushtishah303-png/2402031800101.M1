<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful CSS Example</title>

    
    <link rel="stylesheet" href="style.css">

    
    <style>
        h2 {
            font-style: italic;
        }
    </style>
</head>

<body>

    
    <h1 id="para1">Hello World</h1>

    
    <h1>Welcome to CSS Styling</h1>

    
    <h2>This is Internal CSS</h2>

    
    <h3 class="class1 class2">
        Example of Multiple Classes
    </h3>

    
    <h4>Srushti</h4>
    <h5>Shah</h5>

    
    <div>
        <h1>This is a Div Tag</h1>
    </div>


    <h1 class="myclass">Styled with Class</h1>

    
    <p style="background: blue; color: white;">
        My Inline CSS Code
    </p>

</body>
</html>
