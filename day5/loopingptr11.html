<!DOCTYPE html>
<html>
<head>
    <title>Nested Loop in JavaScript</title>
</head>
<body>

    <h2>Nested Loop Example</h2>

    <script>
        // Outer loop
        for (let i = 1; i <= 5; i++) {

            // Inner loop
            for (let j = 1; j <= i; j++) {
                document.write("* ");
            }

            document.write("<br>");
        }
    </script>

</body>
</html>
