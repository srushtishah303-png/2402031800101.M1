<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>

let str = "javascript";
let vowels = "aeiou";
let count = 0;
let i = 0;

do{
    if(vowels.includes(str[i])){
        count++;
    }
    i++;
}while(i < str.length);

document.getElementById("demo").innerHTML = count;

</script>

</body>
</html>
